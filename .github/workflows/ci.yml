name: CI

# GitHub-hosted runners only: this repository is public, and pull requests
# from forks must never reach a persistent machine. See docs/deployment.md.

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Builds the real Postgres image, migrates it, and checks that a built web
  # and api answer through the same entry point production uses.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:up
      - run: pnpm build

      - name: Start api and web
        run: |
          set -a; . ./.env; set +a
          nohup node apps/api/dist/main.mjs > api.log 2>&1 &
          PORT=3000 nohup node apps/web/.output/server/index.mjs > web.log 2>&1 &
          CAIRN_ENV=staging PORT=3001 nohup node apps/web/.output/server/index.mjs > web-staging.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "web did not become healthy" >&2
          exit 1

      - name: Health check through web
        run: |
          curl -fsS http://localhost:3000/healthz | tee healthz.json
          jq -e '.status == "ok" and .api.status == "ok" and .api.database == "ok"' healthz.json

      - name: Extensions work
        run: |
          psql() { docker compose -f docker/compose.dev.yml exec -T postgres psql -U cairn -d cairn -tAc "$1"; }
          test "$(psql "select count(*) from pg_extension where extname in ('vector', 'pgroonga')")" = 2
          test "$(psql "select '知识花园' &@~ '花园'")" = t
          test "$(psql "select '[1,2]'::vector <-> '[1,3]'::vector")" = 1

      - name: Pages and api routes
        run: |
          curl -fsS http://localhost:3000/ | grep -q 'Cairn'
          curl -fsS http://localhost:3000/zh | grep -q '知识花园'
          curl -fsS http://localhost:3000/api/openapi.json | jq -e '.openapi == "3.1.0"'

      - name: Staging is not indexable
        run: |
          headers() { curl -fsS -D - -o /dev/null "$1"; }
          headers http://localhost:3001/ | grep -qi '^x-robots-tag: noindex'
          curl -fsS http://localhost:3001/robots.txt | grep -qx 'Disallow: /'
          if headers http://localhost:3000/ | grep -qi '^x-robots-tag'; then
            echo "production responses must not carry X-Robots-Tag" >&2
            exit 1
          fi

      - name: Logs
        if: failure()
        run: |
          for f in api.log web.log web-staging.log; do echo "== $f"; cat "$f" || true; done
          docker compose -f docker/compose.dev.yml logs postgres
