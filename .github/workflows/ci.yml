name: CI

# GitHub-hosted runners only: this repository is public, and pull requests
# from forks must never reach a persistent machine. See docs/deployment.md.

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Builds the three real images and runs them with docker/compose.yml, the
  # file self-hosters and codenav's own instances use.
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          load: true
          tags: ghcr.io/codenav-ltd/cairn-api:ci
          build-args: CAIRN_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          load: true
          tags: ghcr.io/codenav-ltd/cairn-web:ci
          build-args: CAIRN_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=smoke

      - name: Build postgres image
        uses: docker/build-push-action@v7
        with:
          context: docker/postgres
          load: true
          tags: ghcr.io/codenav-ltd/cairn-postgres:ci
          cache-from: type=gha,scope=smoke-postgres
          cache-to: type=gha,scope=smoke-postgres,mode=max

      - name: Start the stack
        run: |
          cat > .env <<EOF
          CAIRN_PUBLIC_URL=http://localhost:3000
          CAIRN_SECRET=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          CAIRN_ENV=production
          CAIRN_TAG=ci
          CAIRN_POSTGRES_TAG=ci
          CAIRN_HTTP_BIND=127.0.0.1:3000
          CAIRN_AUTO_MIGRATE=true
          EOF
          docker compose up -d --wait --wait-timeout 120 --pull never

      - name: Health check through web
        run: |
          curl -fsS http://localhost:3000/healthz | tee healthz.json
          jq -e --arg v "$GITHUB_SHA" '.status == "ok" and .version == $v and .api.version == $v and .api.database == "ok"' healthz.json

      - name: Extensions work
        run: |
          psql() { docker compose exec -T postgres psql -U cairn -d cairn -tAc "$1"; }
          test "$(psql "select count(*) from pg_extension where extname in ('vector', 'pgroonga')")" = 2
          test "$(psql "select '知识花园' &@~ '花园'")" = t
          test "$(psql "select '[1,2]'::vector <-> '[1,3]'::vector")" = 1

      - name: Pages and api routes
        run: |
          curl -fsS http://localhost:3000/ | grep -q 'Cairn'
          curl -fsS http://localhost:3000/zh | grep -q '知识花园'
          curl -fsS http://localhost:3000/ | grep -q 'hreflang="zh-CN" href="http://localhost:3000/zh"\|href="http://localhost:3000/zh" hreflang="zh-CN"'
          curl -fsS http://localhost:3000/api/openapi.json | jq -e '.openapi == "3.1.0"'
          curl -fsS http://localhost:3000/robots.txt | grep -qx 'Allow: /'

      - name: Migrate command is idempotent
        run: docker compose run --rm api node dist/main.mjs migrate

      - name: Staging is not indexable
        run: |
          headers() { curl -fsS -D - -o /dev/null "$1"; }
          if headers http://localhost:3000/ | grep -qi '^x-robots-tag'; then
            echo "production responses must not carry X-Robots-Tag" >&2
            exit 1
          fi
          CAIRN_ENV=staging docker compose up -d --wait --wait-timeout 60 --pull never web
          headers http://localhost:3000/ | grep -qi '^x-robots-tag: noindex'
          curl -fsS http://localhost:3000/robots.txt | grep -qx 'Disallow: /'

      - name: Logs
        if: failure()
        run: docker compose logs
