name: Postgres image

# cairn-postgres changes rarely and its container holds the data, so it is
# built only when its Dockerfile changes and published under a stable tag:
# `18` from main and `18-dev` from dev. A deploy pulls it but only restarts
# Postgres when that tag has actually moved. Staging sets
# CAIRN_POSTGRES_TAG=18-dev, so an image change reaches staging first.
#
# The image is apt installs only, so arm64 is built under QEMU rather than
# with the native-runner matrix images.yml needs for the Node build.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - docker/postgres/**
      - .github/workflows/postgres-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: postgres-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            main) echo "tag=18" >> "$GITHUB_OUTPUT" ;;
            dev)  echo "tag=18-dev" >> "$GITHUB_OUTPUT" ;;
            *) echo "postgres images are published from main or dev only" >&2; exit 1 ;;
          esac

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: docker/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cairn-postgres:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/cairn-postgres:${{ steps.tag.outputs.tag }}-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max
