name: Images

# Builds cairn-api and cairn-web for amd64 and arm64, each on a native runner,
# and publishes multi-arch manifests to GHCR. Called by deploy.yml for every
# deploy; runs on its own for release tags, which are what self-hosters pull.

on:
  workflow_call:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # api and web share the build stage, so the second build is a cache hit
      # up to its own runtime stage.
      - id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          platforms: ${{ matrix.platform }}
          build-args: CAIRN_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/cairn-api,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=images-${{ matrix.runner }}
          cache-to: type=gha,scope=images-${{ matrix.runner }},mode=max

      - id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          platforms: ${{ matrix.platform }}
          build-args: CAIRN_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/cairn-web,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=images-${{ matrix.runner }}

      - name: Export digests
        env:
          API: ${{ steps.api.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          mkdir -p digests/api digests/web
          touch "digests/api/${API#sha256:}" "digests/web/${WEB#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}
          path: digests
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cairn-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest
        working-directory: digests/${{ matrix.image }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cairn-${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:sha-${{ github.sha }}"
